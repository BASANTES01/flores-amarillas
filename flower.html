    <style>
      body {
        background-color: #111;
        color: white;
      }
      .night::after{
          content:"";
          position:absolute;
          width:450px;
          height:450px;
          border-radius:50%;
          top:20px;
          left:50%;
          transform:translateX(-50%);
          background:radial-gradient(circle,#fffde7,#fff59d);
          box-shadow:0 0 80px #fff59d,0 0 180px #fff59d,0 0 280px #fff59d;
          opacity:.9;
          z-index:-1;
      }

      .flower__leaf,
      .flower__leaf--1,
      .flower__leaf--2,
      .flower__leaf--3,
      .flower__leaf--4 {
        background: radial-gradient(
          ellipse at center,
          #fff200 0%,
          #ffc400 55%,
          #e89b00 100%
        ) !important;

        box-shadow:
          0 0 8px rgba(255, 193, 7, 0.7),
          inset 0 0 8px rgba(255, 140, 0, 0.5);
      }
       
      /* 🌿 Tallo verde de girasol */
.flower__line {
  background: linear-gradient(
    to right,
    #145a16,
    #2e8b27,
    #1b6b1f
  ) !important;
}

/* 🍃 Hojas del tallo */
.flower__line__leaf,
.flower__line__leaf--1,
.flower__line__leaf--2,
.flower__line__leaf--3,
.flower__line__leaf--4,
.flower__line__leaf--5,
.flower__line__leaf--6 {

}



      .flower__white-circle {
        background: radial-gradient(

          #3b1d08 0%,
          #5a2d0c 35%,
          #241005 75%,
          #120803 100%
        ) !important;

        border-radius: 50% !important;

        box-shadow:
          inset 0 0 12px #120803,
          0 0 5px rgba(80, 40, 5, 0.8) !important;
      }
      .flower__light {
        background-color: rgb(229, 255, 0) !important;  /* Partícula blanca */
        box-shadow: 0 0 8px rgb(255, 255, 255) !important; /* Brillo blanco */
      }
      .titulo{
            position:fixed !important;
            bottom:-150px !important;
            left:50% !important;
            transform:translateX(-50%) !important;
            width:85% !important;
            text-align:center !important;
            color:white !important;
            font-size:1.1rem !important;
            line-height:1.8 !important;
            z-index:999999 !important;
      }

      /* ✨ LUCIÉRNAGAS */

      .fireflies {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        overflow: hidden;
      }

      .fireflies span {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #fff700;
        box-shadow:
          0 0 6px #fff700,
          0 0 14px #fff59d,
          0 0 25px #fff59d;

        animation: luciernaga 6s infinite ease-in-out;
      }

      /* Posiciones */
      .fireflies span:nth-child(1) {
        left: 8%;
        top: 65%;
        animation-delay: 0s;
      }

      .fireflies span:nth-child(2) {
        left: 18%;
        top: 45%;
        animation-delay: 1s;
      }

      .fireflies span:nth-child(3) {
        left: 28%;
        top: 70%;
        animation-delay: 2s;
      }

      .fireflies span:nth-child(4) {
        left: 38%;
        top: 52%;
        animation-delay: 3s;
      }

      .fireflies span:nth-child(5) {
        left: 48%;
        top: 68%;
        animation-delay: 1.5s;
      }

      .fireflies span:nth-child(6) {
        left: 58%;
        top: 42%;
        animation-delay: 2.5s;
      }

      .fireflies span:nth-child(7) {
        left: 68%;
        top: 63%;
        animation-delay: 4s;
      }

      .fireflies span:nth-child(8) {
        left: 78%;
        top: 48%;
        animation-delay: 3.5s;
      }

      .fireflies span:nth-child(9) {
        left: 88%;
        top: 70%;
        animation-delay: 5s;
      }

      .fireflies span:nth-child(10) {
        left: 93%;
        top: 38%;
        animation-delay: 2s;
      }

      .fireflies span:nth-child(11) {
        left: 15%;
        top: 30%;
        animation-delay: 4.5s;
      }

      .fireflies span:nth-child(12) {
        left: 72%;
        top: 28%;
        animation-delay: 1s;
      }

      /* ✨ Movimiento */
      @keyframes luciernaga {
        0% {
          transform: translate(0, 0) scale(0.6);
          opacity: 0.2;
        }

        25% {
          transform: translate(35px, -45px) scale(1.3);
          opacity: 1;
        }

        50% {
          transform: translate(-30px, -80px) scale(0.7);
          opacity: 0.4;
        }

        75% {
          transform: translate(45px, -25px) scale(1.4);
          opacity: 1;
        }

        100% {
          transform: translate(0, 0) scale(0.6);
          opacity: 0.2;
        }
      }
      .flower__light {
        background-color: #f5c400 !important;
        box-shadow: 0 0 5px #fff59d !important;
      }

      .flower__leafs {
        filter: saturate(1.4);
      }

      .flowers{
        transform:translateY(-180px);
      }
